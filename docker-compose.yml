# StudyFlow (Omni-Study) — one-command containerized deployment.
#
# First run (initializes the SQLite volume, then starts the app):
#   AUTH_SECRET="$(openssl rand -hex 32)" docker compose --profile init up
#   (or: docker compose run --rm app bunx prisma db push --schema prisma/schema.prisma)
# Subsequent runs:
#   docker compose up -d
#
# The full walkthrough lives in docs/DEPLOYMENT.md §Docker.

services:
  studyflow:
    build:
      context: .
    image: studyflow:latest
    restart: unless-stopped
    ports:
      - "${STUDYFLOW_PORT:-3000}:3000"
    environment:
      # REQUIRED in production (DEPLOYMENT.md §3) — generate with
      # `openssl rand -hex 32`. Refuses to boot with the placeholder.
      AUTH_SECRET: "${AUTH_SECRET:?Set AUTH_SECRET before starting (openssl rand -hex 32)}"
      # Canonical public origin (S117/BR7): read at SERVE time by the API
      # routes that use it per-request (e.g. the forgot-password reset URL);
      # sitemap.xml/robots.txt/metadataBase are BUILD-TIME prerendered — bake
      # those with the Dockerfile's NEXT_PUBLIC_SITE_URL build ARG instead.
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}"
      # S121/BV3 — the BU gate passthroughs (DEPLOYMENT.md §2/§3/§8's own
      # commands become true through compose; each empty-string default
      # preserves the gate's documented default semantics):
      # TRUSTED_PROXY_HOPS: unset = the legacy first-hop posture; 0 = never
      #   trust; N>=1 = trust the Nth hop from the right (fails closed).
      TRUSTED_PROXY_HOPS: "${TRUSTED_PROXY_HOPS:-}"
      # DISABLE_IN_APP_*: "1"/"true" omits the in-response OTP/reset delivery
      #   (a real mail transport owns delivery then).
      DISABLE_IN_APP_OTP: "${DISABLE_IN_APP_OTP:-}"
      DISABLE_IN_APP_RESET: "${DISABLE_IN_APP_RESET:-}"
    volumes:
      - db-data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # One-shot database initializer: pushes the schema and (optionally) seeds
  # the demo workspace onto the shared volume. Runs only with --profile init.
  init:
    build:
      context: .
    image: studyflow:latest
    profiles: ["init"]
    environment:
      DATABASE_URL: "file:/data/custom.db"
      # S121/BV3 — SEED_DEMO reaches the seed through compose at last
      # (DEPLOYMENT.md §8's `SEED_DEMO=0 docker compose --profile init up`
      # was a no-op without this declaration; 0/false/no skips the
      # public-credentials demo account, any other value seeds it).
      SEED_DEMO: "${SEED_DEMO:-}"
    volumes:
      - db-data:/data
    command: >
      sh -c "bunx prisma db push --schema prisma/schema.prisma --accept-data-loss
             && bun prisma/seed.ts"

volumes:
  db-data:
